services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sticker-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      NODE_ENV: production
      API_DOCS_ENABLED: "false"
    networks:
      - sticker-internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.sticky-picky-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.sticky-picky-api.entrypoints=websecure
      - traefik.http.routers.sticky-picky-api.tls=true
      - traefik.http.routers.sticky-picky-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.sticky-picky-api.loadbalancer.server.port=${APP_PORT}

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        FRONTEND_VERSION: ${FRONTEND_VERSION}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    command:
      - /bin/sh
      - -c
      - |
        sed -i "s|__BACKEND_URL__|https://$${APP_DOMAIN}/api/v1/|g" /usr/share/nginx/html/index.html
        exec nginx -g 'daemon off;'
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.sticky-picky-frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.sticky-picky-frontend.entrypoints=websecure
      - traefik.http.routers.sticky-picky-frontend.tls=true
      - traefik.http.routers.sticky-picky-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.sticky-picky-frontend.loadbalancer.server.port=80

networks:
  sticker-internal:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  db_data:
