services:
  app:
    environment:
      CI: "true"
      API_DOCS_ENABLED: "true"
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev"]
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  caddy:
    image: caddy:2-alpine
    container_name: sticker-dev-proxy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_BACKEND_DOMAIN: ${APP_BACKEND_DOMAIN}
      APP_PORT: ${APP_PORT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sticker-internal


volumes:
  app_node_modules:
  caddy_data:
  caddy_config:
